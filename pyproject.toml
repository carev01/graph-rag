[project]
name = "graph-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "neo4j>=5.22",
  "asyncpg>=0.29",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "graphiti-core==0.29.2",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "testcontainers[neo4j,postgres]>=4.5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_sync", "src/graph_extract", "src/docext", "src/answer_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["live: hits the real DocExtractor cluster (opt-in)"]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
# Pragmatic baseline (not full --strict): keep the checks that catch real bugs
# (arg-type, attr-defined, return-value, and type-checking inside untyped
# functions), but don't require full annotation coverage / generic
# parametrization on internal helpers and third-party (neo4j/asyncpg/graphiti)
# boundaries. This makes the gate honest and CI-enforceable.
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
# Several deps ship no type stubs (asyncpg, etc.); don't fail on that boundary.
ignore_missing_imports = true
