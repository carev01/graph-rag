name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies (incl. dev)
        run: uv sync --extra dev

      - name: Ruff (lint + format check)
        run: uv run ruff check src tests

      - name: Mypy (type check)
        run: uv run mypy src

      # Integration tests spin Neo4j/Postgres via testcontainers; the GitHub
      # ubuntu runner provides Docker. Live tests (@pytest.mark.live, hitting the
      # DocExtractor cluster + model endpoints) are excluded by the default
      # `-m "not live"` addopts.
      - name: Pytest (non-live)
        run: uv run pytest -m "not live"
